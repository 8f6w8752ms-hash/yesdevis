function eur(n){return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}

 if(/^[qp]\d+$/.test(k)){i=k.slice(1);var q=num(g('q'+i).value),p=num(g('p'+i).value);g('t'+i).value=(q!==null&&p!==null)?eur(q*p):''}

 if(!any){g('ht').value='';g('tva').value='';g('ttc').value=''}else{var tx=num(g('tx').value)||0;g('ht').value=eur(tot);g('tva').value=tx?eur(tot*tx/100):'';g('ttc').value=eur(tot*(1+tx/100))}}
